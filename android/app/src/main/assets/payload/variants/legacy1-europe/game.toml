# The first ARM mixer is an unrolled loop entered through computed ADD pc.
# Source 0x08008A10-0x08008A1C computes k=(-r2)&3; r0=3*k;
# ADD pc,pc,r0,lsl#3 targets 8A24/8A3C/8A54/8A6C (PC reads +8).
# These map to RAM 3D7C/3D94/3DAC/3DC4. Every aligned instruction in
# this exact A8-byte image is ARM code (including the 8A20 MOV r0,r0).
# Reviewed resume aliases expose the whole body after the computed branch.
[[resume_range]]
