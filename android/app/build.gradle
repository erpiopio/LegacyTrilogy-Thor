plugins {
    id 'com.android.application'
}
android {
    namespace 'org.erpiopio.legacytrilogy.thor'
    compileSdk 35

    defaultConfig {
        applicationId 'org.erpiopio.legacytrilogy.thor'
        minSdk 28
        targetSdk 35
        ndk { abiFilters 'arm64-v8a' }
        versionCode 1
        versionName '0.1.0'
    }

    ndkVersion '27.1.12297006'

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
